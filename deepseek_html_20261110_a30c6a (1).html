<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DiamondPlanet — Halloween Wipe 🎃</title>
<style>
  /* --- ОБЩИЕ СТИЛИ --- */
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2a 40%, #2a0a1a 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #eee; overflow-x: hidden; position: relative; padding: 20px;
  }

  /* --- ДЕКОР --- */
  .bat { position: absolute; font-size: 2rem; opacity: 0.3; animation: fly 12s linear infinite; }
  @keyframes fly {
    0% { transform: translate(-10vw, 10vh) rotate(0deg); }
    50% { transform: translate(50vw, 30vh) rotate(20deg); }
    100% { transform: translate(110vw, 10vh) rotate(0deg); }
  }
  .pumpkin { position: absolute; font-size: 3rem; opacity: 0.15; }
  .pumpkin1 { top: 10%; left: 5%; }
  .pumpkin2 { bottom: 10%; right: 5%; }
  .pumpkin3 { top: 50%; right: 10%; font-size: 2rem; }

  /* --- ЗАГОЛОВОК --- */
  header { text-align: center; margin-bottom: 20px; z-index: 2; }
  h1 {
    font-size: 2.8rem; letter-spacing: 3px;
    background: linear-gradient(90deg, #66d9ff, #ffffff, #ff8c00, #cc00ff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    text-shadow: 0 0 30px rgba(255, 140, 0, 0.5);
  }
  .subtitle { font-size: 1rem; color: #aaa; margin-top: 5px; letter-spacing: 2px; }

  /* --- СТАТУС СЕРВЕРА --- */
  #serverStatus { text-align: center; margin-bottom: 30px; z-index: 2; }
  #onlineCount { font-size: 2rem; font-weight: bold; color: #66d9ff; }

  /* --- КОНТЕЙНЕР С ФОРМАМИ --- */
  .container { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; z-index: 2; }
  .card {
    background: rgba(20, 10, 30, 0.85);
    border: 2px solid #ff8c00;
    border-radius: 16px;
    padding: 25px 30px;
    width: 320px;
    box-shadow: 0 0 25px rgba(255, 140, 0, 0.3);
    backdrop-filter: blur(5px);
    transition: transform 0.2s, box-shadow 0.2s;
    position: relative;
  }
  .card:hover { transform: translateY(-5px); box-shadow: 0 0 35px rgba(255, 140, 0, 0.6); }
  .card h2 { text-align: center; margin-bottom: 20px; color: #ff8c00; font-size: 1.4rem; }

  /* --- ПОЛЯ ВВОДА --- */
  input {
    width: 100%; padding: 12px; margin-bottom: 12px;
    background: #0a0a1a; border: 1px solid #444; border-radius: 8px;
    color: #fff; font-size: 1rem; outline: none; transition: border 0.2s;
  }
  input:focus { border-color: #ff8c00; box-shadow: 0 0 10px rgba(255, 140, 0, 0.4); }
  input::placeholder { color: #777; }

  /* --- КНОПКИ --- */
  .btn {
    width: 100%; padding: 12px; margin-top: 8px;
    background: linear-gradient(90deg, #ff8c00, #cc00ff);
    border: none; border-radius: 8px; color: #fff; font-size: 1rem;
    font-weight: bold; cursor: pointer; transition: opacity 0.2s, transform 0.1s;
  }
  .btn:hover { opacity: 0.9; }
  .btn:active { transform: scale(0.97); }
  .btn-admin { background: linear-gradient(90deg, #cc00ff, #ff0066); }

  /* --- СКРЫТЫЕ ПОЛЯ --- */
  .hidden { display: none !important; }

  /* --- ПОДВАЛ --- */
  footer { position: absolute; bottom: 10px; font-size: 0.8rem; color: #555; z-index: 2; }

  /* --- АДАПТИВ --- */
  @media (max-width: 700px) {
    h1 { font-size: 2rem; }
    .container { flex-direction: column; align-items: center; }
  }
</style>
</head>
<body>

  <!-- ДЕКОР -->
  <div class="bat" style="top: 20%; animation-delay: 0s;">🦇</div>
  <div class="bat" style="top: 40%; animation-delay: 3s;">🦇</div>
  <div class="bat" style="top: 60%; animation-delay: 6s;">🦇</div>
  <div class="pumpkin pumpkin1">🎃</div>
  <div class="pumpkin pumpkin2">🎃</div>
  <div class="pumpkin pumpkin3">🎃</div>

  <!-- ЗАГОЛОВОК -->
  <header>
    <h1>DiamondPlanet</h1>
    <div class="subtitle">🎃 Halloween Wipe 2026 🎃</div>
  </header>

  <!-- СТАТУС СЕРВЕРА -->
  <div id="serverStatus">
    <div style="font-size:1.1rem; color:#ff8c00;">🎃 Онлайн на сервере:</div>
    <div id="onlineCount">Загрузка...</div>
  </div>

  <!-- ФОРМЫ ВХОДА/РЕГИСТРАЦИИ -->
  <div class="container">
    <div class="card" id="playerCard">
      <h2>👤 Игрок</h2>
      <input type="text" id="playerNick" placeholder="Никнейм (Minecraft)">
      <input type="password" id="playerPass" placeholder="Пароль">
      <button class="btn" onclick="playerAction()">Войти / Зарегистрироваться</button>
    </div>

    <div class="card" id="adminCard">
      <h2>🛡️ Администратор</h2>
      <input type="password" id="secretCode" placeholder="Секретный код (только для админов)">
      <div id="adminFields" class="hidden">
        <input type="text" id="adminNick" placeholder="Никнейм (Minecraft)">
        <input type="password" id="adminPass" placeholder="Пароль">
      </div>
      <button class="btn btn-admin" onclick="adminAction()">Войти / Зарегистрироваться</button>
    </div>
  </div>

  <!-- ЛИЧНЫЙ КАБИНЕТ -->
  <div id="profileScreen" class="hidden" style="z-index:10; width: 90%; max-width: 600px; text-align: center;">
    <div class="card" style="width: 100%; max-width: 100%;">
      <button onclick="logout()" style="position: absolute; top: 15px; right: 15px; background: #333; border: none; color: #fff; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 0.8rem;">Выйти</button>
      
      <div style="display: flex; flex-direction: column; align-items: center; margin-bottom: 20px;">
        <div id="profileAvatar" style="font-size: 4rem; margin-bottom: 10px; cursor: pointer;" title="Нажми, чтобы сменить аватар" onclick="changeAvatar()">👤</div>
        <div style="font-size: 0.8rem; color: #888; margin-bottom: 10px;">(Нажми на аватар, чтобы сменить)</div>
        <h2 style="margin: 0; font-size: 1.8rem; color: #66d9ff;">
          <span id="profileDonate" style="font-weight: 900;">[Игрок]</span> 
          <span id="profileNick">Никнейм</span>
        </h2>
      </div>

      <div style="background: rgba(0,0,0,0.5); padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #ff8c00;">
        <div style="font-size: 1rem; color: #aaa;">Ваш баланс:</div>
        <div style="font-size: 2rem; font-weight: bold; color: #ff8c00;">🎃 <span id="profileBalance">0</span> тыковок</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <button class="btn" onclick="window.location.href='mailto:c00lcat_t@mail.ru?subject=Поддержка DiamondPlanet&body=Привет! Мой ник: ' + document.getElementById('profileNick').innerText">✉️ Написать в поддержку</button>
        <button class="btn" style="background: linear-gradient(90deg, #0077FF, #00C2FF);" onclick="window.open('https://vk.ru/club237224535', '_blank')">💬 Наше сообщество в VK</button>
      </div>
    </div>
  </div>

  <!-- ПАНЕЛЬ АДМИНИСТРАТОРА -->
  <div id="adminPanel" class="hidden" style="z-index:10; width: 90%; max-width: 600px; text-align: center; margin-top: 20px;">
    <div class="card" style="width: 100%; max-width: 100%; border-color: #ff0066; box-shadow: 0 0 25px rgba(255, 0, 102, 0.3);">
      <h2 style="color: #ff0066;">🛡️ Панель Администратора</h2>
      
      <input type="text" id="adminTargetNick" placeholder="Никнейм игрока">
      
      <div style="display: flex; gap: 10px; margin-bottom: 10px;">
        <input type="number" id="adminTykvaAmount" placeholder="Тыковки" style="margin-bottom: 0;">
        <button class="btn" style="margin-top: 0; background: #ff8c00; width: 100px;" onclick="giveTykva()">Выдать 🎃</button>
      </div>

      <div style="display: flex; gap: 10px;">
        <input type="text" id="adminDonateName" placeholder="Донат (напр. VIP)" style="margin-bottom: 0;">
        <input type="color" id="adminDonateColor" value="#ff8c00" style="width: 50px; padding: 2px; height: 42px; margin-bottom: 0;">
        <button class="btn" style="margin-top: 0; background: #cc00ff; width: 100px;" onclick="giveDonate()">Выдать</button>
      </div>
    </div>
  </div>

  <footer>DiamondPlanet © 2026 • Сделано с 🎃</footer>

  <!-- ПОДКЛЮЧЕНИЕ FIREBASE SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // 🔥 ТВОЙ FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "AIzaSyAveS4vzoiCM6Cz1DbGzdOr6mjN3b77yoo",
      authDomain: "diamondplanet-2c504.firebaseapp.com",
      projectId: "diamondplanet-2c504",
      storageBucket: "diamondplanet-2c504.firebasestorage.app",
      messagingSenderId: "88657617214",
      appId: "1:88657617214:web:b482b37859b62a11cf8c6f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const ADMIN_SECRET = "2258";
    let currentUser = null;

    // Загрузка профиля из Firestore
    async function loadProfile(nick, role) {
      const ref = doc(db, role === 'admin' ? 'admins' : 'players', nick);
      const snap = await getDoc(ref);
      if (!snap.exists()) return null;
      const data = snap.data();
      return {
        nick: nick,
        role: role,
        donate: data.donate || (role === 'admin' ? 'Админ' : 'Игрок'),
        donateColor: data.donateColor || (role === 'admin' ? '#ff0066' : '#888888'),
        balance: data.balance || 0,
        avatar: data.avatar || '👤'
      };
    }

    // Открытие кабинета
    async function openProfile(nick, role) {
      const profile = await loadProfile(nick, role);
      if (!profile) { alert("Ошибка загрузки профиля"); return; }

      currentUser = profile;
      document.querySelector('.container').classList.add('hidden');
      document.getElementById('profileScreen').classList.remove('hidden');
      document.querySelector('header').classList.add('hidden');
      document.getElementById('serverStatus').classList.add('hidden');

      document.getElementById('profileNick').textContent = profile.nick;
      document.getElementById('profileDonate').textContent = `[${profile.donate}]`;
      document.getElementById('profileDonate').style.color = profile.donateColor;
      document.getElementById('profileBalance').textContent = profile.balance;
      document.getElementById('profileAvatar').textContent = profile.avatar;

      if (role === 'admin') {
        document.getElementById('adminPanel').classList.remove('hidden');
      } else {
        document.getElementById('adminPanel').classList.add('hidden');
      }
    }

    // Выход
    window.logout = function() {
      currentUser = null;
      document.querySelector('.container').classList.remove('hidden');
      document.getElementById('profileScreen').classList.add('hidden');
      document.getElementById('adminPanel').classList.add('hidden');
      document.querySelector('header').classList.remove('hidden');
      document.getElementById('serverStatus').classList.remove('hidden');
      document.getElementById('playerNick').value = '';
      document.getElementById('playerPass').value = '';
      document.getElementById('secretCode').value = '';
      document.getElementById('adminNick').value = '';
      document.getElementById('adminPass').value = '';
    };

    // Логика игрока
    window.playerAction = async function() {
      const nick = document.getElementById('playerNick').value.trim();
      const pass = document.getElementById('playerPass').value.trim();

      if (!nick || !pass) { alert("❌ Заполни никнейм и пароль!"); return; }

      const userRef = doc(db, "players", nick);
      const userSnap = await getDoc(userRef);

      if (userSnap.exists()) {
        const data = userSnap.data();
        if (data.password === pass) {
          openProfile(nick, 'player');
        } else {
          alert("❌ Неверный пароль!");
        }
      } else {
        await setDoc(userRef, {
          password: pass,
          role: "player",
          donate: "Игрок",
          donateColor: "#888888",
          balance: 0,
          avatar: "👤",
          createdAt: new Date().toISOString()
        });
        alert(`🎉 Аккаунт игрока ${nick} создан!`);
        openProfile(nick, 'player');
      }
    };

    // Логика админа
    window.adminAction = async function() {
      const code = document.getElementById('secretCode').value.trim();
      const fields = document.getElementById('adminFields');

      if (fields.classList.contains('hidden')) {
        if (code === ADMIN_SECRET) {
          fields.classList.remove('hidden');
          alert("✅ Код верный! Теперь введи никнейм и пароль.");
        } else {
          alert("❌ Неверный секретный код!");
        }
        return;
      }

      const nick = document.getElementById('adminNick').value.trim();
      const pass = document.getElementById('adminPass').value.trim();

      if (!nick || !pass) { alert("❌ Заполни никнейм и пароль!"); return; }

      const adminRef = doc(db, "admins", nick);
      const adminSnap = await getDoc(adminRef);

      if (adminSnap.exists()) {
        const data = adminSnap.data();
        if (data.password === pass) {
          openProfile(nick, 'admin');
        } else {
          alert("❌ Неверный пароль!");
        }
      } else {
        await setDoc(adminRef, {
          password: pass,
          role: "admin",
          donate: "Админ",
          donateColor: "#ff0066",
          balance: 0,
          avatar: "👤",
          createdAt: new Date().toISOString()
        });
        alert(`🎉 Аккаунт администратора ${nick} создан!`);
        openProfile(nick, 'admin');
      }
    };

    // Выдача тыковок
    window.giveTykva = async function() {
      if (!currentUser || currentUser.role !== 'admin') return;
      const targetNick = document.getElementById('adminTargetNick').value.trim();
      const amount = parseInt(document.getElementById('adminTykvaAmount').value);

      if (!targetNick || !amount || amount <= 0) { alert("❌ Укажи ник и количество тыковок!"); return; }

      const targetRef = doc(db, "players", targetNick);
      const targetSnap = await getDoc(targetRef);

      if (!targetSnap.exists()) { alert("❌ Игрок не найден!"); return; }

      const currentBalance = targetSnap.data().balance || 0;
      await updateDoc(targetRef, { balance: currentBalance + amount });
      alert(`✅ Выдано ${amount} тыковок игроку ${targetNick}! Новый баланс: ${currentBalance + amount}`);
    };

    // Выдача доната
    window.giveDonate = async function() {
      if (!currentUser || currentUser.role !== 'admin') return;
      const targetNick = document.getElementById('adminTargetNick').value.trim();
      const donateName = document.getElementById('adminDonateName').value.trim();
      const donateColor = document.getElementById('adminDonateColor').value;

      if (!targetNick || !donateName) { alert("❌ Укажи ник и название доната!"); return; }

      const targetRef = doc(db, "players", targetNick);
      const targetSnap = await getDoc(targetRef);

      if (!targetSnap.exists()) { alert("❌ Игрок не найден!"); return; }

      await updateDoc(targetRef, { donate: donateName, donateColor: donateColor });
      alert(`✅ Игроку ${targetNick} выдан донат "${donateName}"!`);
    };

    // Смена аватара
    window.changeAvatar = function() {
      if (!currentUser) return;
      const newAvatar = prompt("Введи эмодзи для аватара (например: 😺, 💀, 👾):");
      if (newAvatar && newAvatar.length <= 2) {
        const collection = currentUser.role === 'admin' ? 'admins' : 'players';
        updateDoc(doc(db, collection, currentUser.nick), { avatar: newAvatar }).then(() => {
          currentUser.avatar = newAvatar;
          document.getElementById('profileAvatar').textContent = newAvatar;
        });
      }
    };

    // Онлайн сервера
    const SERVER_ADDRESS = "DiamondPlanet.aternos.me";
    async function updateOnline() {
      const onlineEl = document.getElementById("onlineCount");
      try {
        const response = await fetch(`https://api.mcsrvstat.us/3/${SERVER_ADDRESS}`);
        const data = await response.json();
        if (data.online) {
          onlineEl.textContent = `${data.players.online} / ${data.players.max}`;
          onlineEl.style.color = "#66d9ff";
        } else {
          onlineEl.textContent = "Сервер выключен 😴";
          onlineEl.style.color = "#888";
        }
      } catch (e) {
        onlineEl.textContent = "Ошибка 😢";
        onlineEl.style.color = "#ff4444";
      }
    }
    updateOnline();
    setInterval(updateOnline, 60000);
  </script>

</body>
</html>
